<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Class</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="booking-container">

<h1>Book Your Class</h1>

<form id="bookingForm" class="booking-form">

<input type="hidden" id="classid">
<input type="hidden" id="date">
<input type="hidden" id="time">

<div class="form-group">
<label>Session Type</label>
<select id="sessionType">
<option value="Joined Session">Joined Session</option>
<option value="Private Session">Private Session</option>
</select>
</div>

<div class="form-row">

<div class="form-group">
<label>Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

</div>

<div class="form-row">

<div class="form-group">
<label>Phone</label>
<input type="text" id="phone">
</div>

</div>

<div class="form-row">

<div class="form-group">
<label>Adults</label>
<input type="number" id="adult" value="1">
</div>

<div class="form-group">
<label>Children</label>
<input type="number" id="child" value="0">
</div>

</div>

<button type="submit" class="booking-button">
Submit Booking
</button>

</form>

</div>

<script src="booking.js"></script>

</body>

</html>
