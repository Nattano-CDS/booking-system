<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Cooking Class Booking</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:40px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ddd;
border-radius:5px;
}

button{
margin-top:20px;
width:100%;
padding:12px;
background:#000;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#333;
}

#message{
margin-top:15px;
text-align:center;
}

.success{
color:green;
}

.error{
color:red;
}

#loadingOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
color:white;
font-size:18px;
z-index:9999;
}

.spinner{
width:40px;
height:40px;
border:5px solid white;
border-top:5px solid transparent;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:10px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

</style>

</head>

<body>

<div class="container">

<h2>Book Cooking Class</h2>

<form id="bookingForm">

<input type="hidden" id="sessionType" value="CLS001">
<input type="hidden" id="classID" value="CLS001">

<label>Booking Date</label>
<input type="date" id="bookingDate" required>

<label>Booking Time</label>
<select id="bookingTime">
<option value="10:30 - 13:00">10:30 - 13:00</option>
<option value="14:00 - 16:30">14:00 - 16:30</option>
</select>

<label>Adults</label>
<input type="number" id="adults" value="1" min="1">

<label>Children</label>
<input type="number" id="children" value="0" min="0">

<label>Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Phone</label>
<input type="text" id="phone" required>

<label>Nationality</label>
<input type="text" id="nationality">

<button id="submitBtn" type="submit">Book Now</button>

</form>

<div id="message"></div>

</div>

<div id="loadingOverlay">
<div class="spinner"></div>
<p>Processing your booking...</p>
</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbzkoUpLUDR03lJnx6Bxunnd3AFJP7CXLpHtiYnA763w1mS019JZE_yutidiISJpSEdp/exec";

const form = document.getElementById("bookingForm");
const overlay = document.getElementById("loadingOverlay");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");

form.addEventListener("submit", function(e){

e.preventDefault();

// prevent multiple clicks
button.disabled = true;

// show overlay
overlay.style.display = "flex";

const data = {

sessionType: document.getElementById("sessionType").value,
classID: document.getElementById("classID").value,
bookingDate: document.getElementById("bookingDate").value,
bookingTime: document.getElementById("bookingTime").value,
adults: document.getElementById("adults").value,
children: document.getElementById("children").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
name: document.getElementById("name").value,
nationality: document.getElementById("nationality").value

};

fetch(scriptURL, {

method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify(data)

})
.then(res => res.json())
.then(response => {

overlay.style.display = "none";
button.disabled = false;

if(response.result === "success"){

message.innerHTML =
"<p class='success'>Booking submitted successfully!</p>";

form.reset();

}else{

message.innerHTML =
"<p class='error'>Booking failed</p>";

}

})
.catch(error => {

overlay.style.display = "none";
button.disabled = false;

message.innerHTML =
"<p class='error'>Error submitting booking</p>";

console.error(error);

});

});

</script>

</body>
</html>
