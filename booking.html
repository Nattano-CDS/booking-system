<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cooking Class Booking</title>

<style>

body{
font-family: Arial;
background:#f5f5f5;
padding:40px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ddd;
border-radius:5px;
}

button{
margin-top:20px;
width:100%;
padding:12px;
background:#000;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#333;
}

.success{
color:green;
text-align:center;
margin-top:15px;
}

.error{
color:red;
text-align:center;
margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<h2>Book Cooking Class</h2>

<form id="bookingForm">

<input type="hidden" id="sessionType" value="CLS001">
<input type="hidden" id="classID" value="CLS001">

<label>Booking Date</label>
<input type="date" id="bookingDate" required>

<label>Booking Time</label>
<select id="bookingTime">
<option value="10:30 - 13:00">10:30 - 13:00</option>
<option value="14:00 - 16:30">14:00 - 16:30</option>
</select>

<label>Adults</label>
<input type="number" id="adults" value="1" min="1">

<label>Children</label>
<input type="number" id="children" value="0" min="0">

<label>Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Phone</label>
<input type="text" id="phone" required>

<label>Nationality</label>
<input type="text" id="nationality">

<button type="submit">Book Now</button>

</form>

<div id="message"></div>

</div>

<script>

const scriptURL = "YOUR_SCRIPT_URL";

document.getElementById("bookingForm").addEventListener("submit", function(e){

e.preventDefault();

const data = {

sessionType: document.getElementById("sessionType").value,
classID: document.getElementById("classID").value,
bookingDate: document.getElementById("bookingDate").value,
bookingTime: document.getElementById("bookingTime").value,
adults: document.getElementById("adults").value,
children: document.getElementById("children").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
name: document.getElementById("name").value,
nationality: document.getElementById("nationality").value

};

fetch(scriptURL, {

method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify(data)

})
.then(res=>res.json())
.then(response=>{

if(response.result==="success"){

document.getElementById("message").innerHTML =
"<p class='success'>Booking submitted successfully</p>";

document.getElementById("bookingForm").reset();

}else{

document.getElementById("message").innerHTML =
"<p class='error'>Booking failed</p>";

}

})
.catch(error=>{

document.getElementById("message").innerHTML =
"<p class='error'>Error submitting booking</p>";

console.error(error);

});

});

</script>

</body>
</html>
