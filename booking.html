<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Book Your Class</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
padding:40px;
}

.container{
max-width:750px;
margin:auto;
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
margin-bottom:25px;
}

label{
font-size:14px;
margin-bottom:6px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.field{
display:flex;
flex-direction:column;
}

input,select{
padding:12px;
border:1px solid #ddd;
border-radius:8px;
width:100%;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
margin-top:30px;
background:black;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
color:white;
font-size:20px;
z-index:9999;
}

/* Mobile */

@media (max-width:600px){

.grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Book Your Class</h1>

<form id="bookingForm">

<input type="hidden" id="classID">
<input type="hidden" id="bookingDate">
<input type="hidden" id="bookingTime">

<div class="field">

<label>Session Type</label>

<select id="sessionType">
<option value="CLS001">Joined Session</option>
<option value="PRIVATE">Private Session</option>
</select>

</div>

<div class="grid">

<div class="field">
<label>Name</label>
<input type="text" id="name" required>
</div>

<div class="field">
<label>Nationality</label>
<input type="text" id="nationality">
</div>

<div class="field">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="field">
<label>Phone</label>
<input type="text" id="phone" required>
</div>

<div class="field">
<label>Adults</label>
<input type="number" id="adults" value="1" min="1">
</div>

<div class="field">
<label>Children</label>
<input type="number" id="children" value="0" min="0">
</div>

</div>

<button id="submitBtn">Submit Booking</button>

</form>

</div>

<div id="overlay">Processing booking...</div>

<script>

const scriptURL = "YOUR_SCRIPT_URL";

/* Get parameters from index.html */

const params = new URLSearchParams(window.location.search);

document.getElementById("classID").value = params.get("classID");
document.getElementById("bookingDate").value = params.get("date");
document.getElementById("bookingTime").value = params.get("time");

/* Submit booking */

const form = document.getElementById("bookingForm");
const overlay = document.getElementById("overlay");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", function(e){

e.preventDefault();

button.disabled = true;
overlay.style.display = "flex";

const data = {

sessionType: document.getElementById("sessionType").value,
classID: document.getElementById("classID").value,
bookingDate: document.getElementById("bookingDate").value,
bookingTime: document.getElementById("bookingTime").value,
adults: document.getElementById("adults").value,
children: document.getElementById("children").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
name: document.getElementById("name").value,
nationality: document.getElementById("nationality").value

};

fetch(scriptURL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
})
.then(res=>res.json())
.then(res=>{

overlay.style.display="none";
button.disabled=false;

if(res.result==="success"){

alert("Booking submitted successfully");

form.reset();

}else{

alert("Booking failed");

}

})
.catch(err=>{

overlay.style.display="none";
button.disabled=false;

alert("Error submitting booking");

});

});

</script>

</body>

</html>
