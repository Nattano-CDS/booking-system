<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Class</title>

<link rel="stylesheet" href="style.css">

<style>

.form-box{
background:white;
padding:40px;
border-radius:16px;
max-width:700px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.form-group{
display:flex;
flex-direction:column;
}

input,select{

padding:12px;
border-radius:8px;
border:1px solid #ddd;

}

.full{
grid-column:1 / -1;
}

</style>

</head>

<body>

<div class="container">

<div class="form-box">

<h1>Book Your Class</h1>

<form id="bookingForm">

<input type="hidden" id="classid">
<input type="hidden" id="classdate">
<input type="hidden" id="classtime">

<div class="form-group full">

<label>Session Type</label>

<select id="session">

<option value="Joined Session">Joined Session</option>
<option value="Private Session">Private Session</option>

</select>

</div>

<div class="form-grid">

<div class="form-group">

<label>Name</label>
<input type="text" id="name" required>

</div>

<div class="form-group">

<label>Nationality</label>
<input type="text" id="nationality">

</div>

<div class="form-group">

<label>Email</label>
<input type="email" id="email" required>

</div>

<div class="form-group">

<label>Phone</label>
<input type="text" id="phone">

</div>

<div class="form-group">

<label>Adults</label>
<input type="number" id="adult" value="1">

</div>

<div class="form-group">

<label>Children</label>
<input type="number" id="child" value="0">

</div>

</div>

<button type="submit" class="full">Submit Booking</button>

</form>

</div>

</div>

<script src="booking.js"></script>

</body>

</html>
