<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Class</title>

<link rel="stylesheet" href="style.css">

<style>

.form-box{
background:white;
padding:40px;
border-radius:16px;
max-width:700px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.form-group{
display:flex;
flex-direction:column;
}

input,select{
padding:12px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
}

.full{
grid-column:1 / -1;
}

.class-summary{
background:#f7f7f7;
padding:15px;
border-radius:10px;
margin-top:10px;
}

.submit-btn{

width:100%;
margin-top:25px;

background:#111;
color:white;

border:none;

padding:14px;

border-radius:10px;

font-size:16px;

cursor:pointer;

}

.submit-btn:hover{
background:#333;
}

</style>

</head>

<body>

<div class="container">

<div class="form-box">

<h1>Book Your Class</h1>

<!-- CLASS INFO -->
<div class="class-summary">

<div><strong>Class:</strong> <span id="className"></span></div>
<div><strong>Date:</strong> <span id="classDate"></span></div>
<div><strong>Time:</strong> <span id="classTime"></span></div>

</div>

<form id="bookingForm">

<input type="hidden" id="classid">
<input type="hidden" id="classdate">
<input type="hidden" id="classtime">

<div class="form-group">

<label>Session Type</label>

<select id="session">

<option value="Joined Session">Joined Session</option>
<option value="Private Session">Private Session</option>

</select>

</div>

<div class="form-grid">

<div class="form-group">

<label>Name</label>
<input type="text" id="name" required>

</div>

<div class="form-group">

<label>Nationality</label>
<input type="text" id="nationality">

</div>

<div class="form-group">

<label>Email</label>
<input type="email" id="email" required>

</div>

<div class="form-group">

<label>Phone</label>
<input type="text" id="phone">

</div>

<div class="form-group">

<label>Adults</label>
<input type="number" id="adult" value="1">

</div>

<div class="form-group">

<label>Children</label>
<input type="number" id="child" value="0">

</div>

</div>

<button type="submit" class="submit-btn">
Submit Booking
</button>

</form>

</div>

</div>

<script src="booking.js"></script>

</body>

</html>
