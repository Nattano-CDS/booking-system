<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Booking</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:40px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

.info{
background:#f0f0f0;
padding:12px;
border-radius:6px;
margin-bottom:15px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ddd;
border-radius:5px;
}

button{
margin-top:20px;
width:100%;
padding:12px;
background:black;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

#loadingOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
color:white;
font-size:18px;
z-index:9999;
}

</style>

</head>

<body>

<div class="container">

<h2>Confirm Your Booking</h2>

<div class="info">
<strong>Date:</strong> <span id="displayDate"></span><br>
<strong>Time:</strong> <span id="displayTime"></span>
</div>

<form id="bookingForm">

<input type="hidden" id="sessionType">
<input type="hidden" id="classID">
<input type="hidden" id="bookingDate">
<input type="hidden" id="bookingTime">

<label>Adults</label>
<input type="number" id="adults" value="1" min="1">

<label>Children</label>
<input type="number" id="children" value="0" min="0">

<label>Name</label>
<input type="text" id="name" required>

<label>Email</label>
<input type="email" id="email" required>

<label>Phone</label>
<input type="text" id="phone" required>

<label>Nationality</label>
<input type="text" id="nationality">

<button id="submitBtn">Confirm Booking</button>

</form>

</div>

<div id="loadingOverlay">Processing booking...</div>

<script>

const scriptURL = "YOUR_SCRIPT_URL";

/* GET URL PARAMETERS */

const params = new URLSearchParams(window.location.search);

const classID = params.get("classID");
const date = params.get("date");
const time = params.get("time");

/* DISPLAY SELECTED SLOT */

document.getElementById("displayDate").innerText = date;
document.getElementById("displayTime").innerText = time;

/* SET HIDDEN INPUTS */

document.getElementById("classID").value = classID;
document.getElementById("sessionType").value = classID;
document.getElementById("bookingDate").value = date;
document.getElementById("bookingTime").value = time;

/* FORM SUBMIT */

const form = document.getElementById("bookingForm");
const overlay = document.getElementById("loadingOverlay");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", function(e){

e.preventDefault();

button.disabled = true;
overlay.style.display = "flex";

const data = {

sessionType: document.getElementById("sessionType").value,
classID: document.getElementById("classID").value,
bookingDate: document.getElementById("bookingDate").value,
bookingTime: document.getElementById("bookingTime").value,
adults: document.getElementById("adults").value,
children: document.getElementById("children").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
name: document.getElementById("name").value,
nationality: document.getElementById("nationality").value

};

fetch(scriptURL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
})
.then(res=>res.json())
.then(res=>{

overlay.style.display="none";
button.disabled=false;

if(res.result==="success"){

alert("Booking successful!");

window.location.href="thankyou.html";

}else{

alert("Booking failed");

}

})
.catch(err=>{

overlay.style.display="none";
button.disabled=false;

alert("Error submitting booking");

});

});

</script>

</body>
</html>
