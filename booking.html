<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Your Class</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="booking-wrapper">

<div class="booking-card">

<h1>Book Your Class</h1>

<form id="bookingForm">

  <input type="hidden" id="sessionType" value="CLS001">
  <input type="hidden" id="classID" value="CLS001">

  <label>Booking Date</label>
  <input type="date" id="bookingDate" required>

  <label>Booking Time</label>
  <select id="bookingTime">
    <option value="10:30 - 13:00">10:30 - 13:00</option>
    <option value="14:00 - 16:30">14:00 - 16:30</option>
  </select>

  <label>Adults</label>
  <input type="number" id="adults" value="1" min="1">

  <label>Children</label>
  <input type="number" id="children" value="0" min="0">

  <label>Name</label>
  <input type="text" id="name" required>

  <label>Email</label>
  <input type="email" id="email" required>

  <label>Phone</label>
  <input type="text" id="phone" required>

  <label>Nationality</label>
  <input type="text" id="nationality">

  <button type="submit">Book Now</button>

</form>

</div>

</div>

<script src="booking.js"></script>

</body>
</html>
