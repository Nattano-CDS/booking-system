<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thai Cooking Classes</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f5f5f5;
}

.header{
background:#000;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.class-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.class-card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.class-card h3{
margin-top:0;
}

button{
margin-top:15px;
padding:10px 16px;
background:black;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#333;
}

</style>

</head>

<body>

<div class="header">
<h1>Thai Cooking Classes</h1>
<p>Learn authentic Thai dishes</p>
</div>

<div class="container">

<div id="classList" class="class-grid">

Loading classes...

</div>

</div>

<script src="js/classes.js"></script>

</body>
</html>
