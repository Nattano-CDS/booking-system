<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cooking Class Booking</title>

<style>

body{
font-family: Arial;
background:#f7f7f7;
margin:0;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:30px;
}

.filter{
margin-bottom:30px;
text-align:center;
}

input[type="date"]{
padding:10px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

.class-list{
display:grid;
grid-template-columns:1fr;
gap:20px;
}

.class-card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.class-title{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.class-info{
color:#666;
margin-bottom:10px;
}

.btn{
display:inline-block;
padding:10px 18px;
background:black;
color:white;
border-radius:6px;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<h1>Cooking Classes</h1>

<div class="filter">
Filter by Date  
<br><br>
<input type="date" id="dateFilter">
</div>

<div id="classList" class="class-list"></div>

</div>

<script src="getClasses.js"></script>

</body>
</html>
